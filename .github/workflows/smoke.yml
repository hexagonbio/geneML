name: Smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install geneML
        run: python -m pip install .
      - name: Run CLI smoke test
        run: geneml --help
      - name: Run model inference smoke test
        run: |
          geneml tests/fixtures/smoke.fasta \
            --output smoke.gff3 \
            --write-raw-scores \
            --cores 1 \
            --min-gene-score 0.5
          test -s smoke.seg
          grep -q '^#track ' smoke.seg
