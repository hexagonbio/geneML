name: Smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-smoke:
    name: macOS smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install geneML
        run: |
          set +e
          python -m pip install . > install.log 2>&1
          status=$?
          cat install.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("install.log").read_text(errors="replace").splitlines()[-20:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=geneML install failure::{text}")
          PY
            exit "$status"
          fi
      - name: Run CLI smoke test
        run: geneml --help
      - name: Run model inference smoke test
        run: |
          set +e
          geneml tests/fixtures/smoke.fasta \
            --output smoke.gff3 \
            --write-raw-scores \
            --cores 1 \
            --min-gene-score 0.5 > smoke.log 2>&1
          status=$?
          cat smoke.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("smoke.log").read_text(errors="replace").splitlines()[-20:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=geneML smoke failure::{text}")
          PY
            exit "$status"
          fi
          if [ ! -s smoke.seg ]; then
            echo "::error::geneML exited successfully but did not create smoke.seg"
            exit 1
          fi
          if ! grep -q '^#track ' smoke.seg; then
            echo "::error::smoke.seg is missing its SEG track header"
            exit 1
          fi
